version: 1
formatters:
  simple:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(lineno)d - %(funcName)s - %(message)s'

handlers:
  console:
    class: logging.StreamHandler
    formatter: simple
    level: DEBUG
    stream: ext://sys.stdout

  file_handler:
    class: logging.handlers.RotatingFileHandler
    filename: ../lets_hack/backend/log/info.log
    formatter: simple
    level: DEBUG
    maxBytes: 1048576  # 1 MB
    backupCount: 5
  file:
    class: logging.FileHandler
    level: DEBUG
    formatter: simple
    filename: ../lets_hack/backend/log/uvicorn.log

loggers:
  security.secure_main:
    level: DEBUG
    handlers: [ console, file_handler ]
    propagate: no
  uvicorn:
    level: DEBUG
    handlers: [ console, file ]
    propagate: no
  uvicorn.error:
    level: DEBUG
    handlers: [ console, file ]
    propagate: no
  uvicorn.access:
    level: DEBUG
    handlers: [ console, file ]
    propagate: yes

root:
  level: DEBUG
  handlers: [ console, file_handler, file ]
